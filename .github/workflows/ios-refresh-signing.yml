name: iOS Refresh Signing (Associated Domains)

# One-off maintenance workflow. Enables the Associated Domains capability on the
# App ID and force-regenerates the App Store provisioning profile (pushing it to
# the certificates repo), so the main build stops failing with
# "provisioning profile doesn't include the Associated Domains capability".
# Run this once after adding the associated-domains entitlement, then re-run the
# normal build.yml iOS job.

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  RUBY_VERSION: '3.3'

jobs:
  refresh-signing:
    runs-on: macos-26
    timeout-minutes: 30
    environment: APP_STORE_CONFIG
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Setup Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Enable Associated Domains + regenerate App Store profile
        working-directory: ios
        env:
          FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ vars.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          FASTLANE_USER: ${{ vars.FASTLANE_USER }}
          OPENSSL_CONF: /dev/null
        run: bundle exec fastlane refresh_appstore_signing
