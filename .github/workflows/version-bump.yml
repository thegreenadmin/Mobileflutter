name: Version Bump

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to bump version (ios, android, or both)'
        required: true
        default: 'both'
        type: choice
        options:
          - ios
          - android
          - both
      bump_type:
        description: 'Type of version bump'
        required: true
        default: 'build'
        type: choice
        options:
          - build
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  bump-ios:
    if: github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'both'
    runs-on: macos-26
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Increment iOS version
        working-directory: ios
        run: |
          if [ "${{ github.event.inputs.bump_type }}" == "major" ]; then
            bundle exec fastlane bump_major_version
          elif [ "${{ github.event.inputs.bump_type }}" == "minor" ]; then
            bundle exec fastlane bump_minor_version
          elif [ "${{ github.event.inputs.bump_type }}" == "patch" ]; then
            bundle exec fastlane bump_patch_version
          else
            bundle exec fastlane increment_build_number_only
          fi

      - name: Commit and push iOS version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ios/Runner.xcodeproj/project.pbxproj pubspec.yaml
          git diff --staged --quiet || git commit -m "chore: bump iOS ${{ github.event.inputs.bump_type }} version [skip ci]"
          git pull --rebase --autostash
          git push

  bump-android:
    if: github.event.inputs.platform == 'android' || github.event.inputs.platform == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Increment Android version
        working-directory: android
        run: |
          if [ "${{ github.event.inputs.bump_type }}" == "major" ]; then
            bundle exec fastlane bump_major_version
          elif [ "${{ github.event.inputs.bump_type }}" == "minor" ]; then
            bundle exec fastlane bump_minor_version
          elif [ "${{ github.event.inputs.bump_type }}" == "patch" ]; then
            bundle exec fastlane bump_patch_version
          else
            bundle exec fastlane increment_version_code_only
          fi

      - name: Commit and push Android version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git diff --staged --quiet || git commit -m "chore: bump Android ${{ github.event.inputs.bump_type }} version [skip ci]"
          git pull --rebase --autostash
          git push
