name: Flutter Mobile CI/CD Pipeline

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build (ios, android, or both)'
        required: true
        default: 'both'
        type: choice
        options:
          - ios
          - android
          - both
      environment:
        description: 'Deployment environment'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
          - release
  push:
    branches: [ main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'ios/**'
      - 'pubspec.yaml'

permissions:
  contents: write
  id-token: write

env:
  FLUTTER_VERSION: '3.41.6'
  RUBY_VERSION: '3.2'

jobs:
  build-ios:
    if: github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'both' || github.event.inputs.platform == ''
    runs-on: macos-26
    timeout-minutes: 120
    environment: APP_STORE_CONFIG
    env:
      BUILD_ENVIRONMENT: ${{ github.event.inputs.environment || 'beta' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy environment file based on build environment
        run: |
          if [ "${{ env.BUILD_ENVIRONMENT }}" == "beta" ]; then
            cp assets/env/api_key_beta.env assets/env/api_key.env
          elif [ "${{ env.BUILD_ENVIRONMENT }}" == "release" ]; then
            cp assets/env/api_key_release.env assets/env/api_key.env
          fi

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Setup Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install
          cd ..

      - name: Setup code signing with Match
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ vars.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          FASTLANE_USER: ${{ vars.FASTLANE_USER }}
          FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          OPENSSL_CONF: /dev/null
        working-directory: ios
        run: bundle exec fastlane sync_signing

      - name: Build iOS app for beta (TestFlight)
        if: env.BUILD_ENVIRONMENT == 'beta'
        env:
          FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ vars.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          FASTLANE_USER: ${{ vars.FASTLANE_USER }}
          OPENSSL_CONF: /dev/null
        working-directory: ios
        run: bundle exec fastlane beta

      - name: Commit and push updated build number
        if: env.BUILD_ENVIRONMENT == 'beta'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ios/Runner.xcodeproj/project.pbxproj
          git diff --staged --quiet || git commit -m "chore: increment iOS build number [skip ci]"
          git push

      - name: Build iOS app for release (App Store)
        if: env.BUILD_ENVIRONMENT == 'release'
        env:
          FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ vars.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          FASTLANE_USER: ${{ vars.FASTLANE_USER }}
          OPENSSL_CONF: /dev/null
        working-directory: ios
        run: bundle exec fastlane release

      - name: Commit and push updated build number
        if: env.BUILD_ENVIRONMENT == 'release'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ios/Runner.xcodeproj/project.pbxproj
          git diff --staged --quiet || git commit -m "chore: increment iOS build number [skip ci]"
          git push

      - name: Upload iOS build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-artifacts
          path: |
            ios/build/*.ipa
            ios/**/*.dSYM.zip
          retention-days: 30

  build-android:
    if: github.event.inputs.platform == 'android' || github.event.inputs.platform == 'both' || github.event.inputs.platform == ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ANDROID_BETA_CONFIG
    env:
      BUILD_ENVIRONMENT: ${{ github.event.inputs.environment || 'beta' }}
      KEYSTORE_FILE: keystore.jks
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy environment file based on build environment
        run: |
          if [ "${{ env.BUILD_ENVIRONMENT }}" == "beta" ]; then
            cp assets/env/api_key_beta.env assets/env/api_key.env
          elif [ "${{ env.BUILD_ENVIRONMENT }}" == "release" ]; then
            cp assets/env/api_key_release.env assets/env/api_key.env
          fi

      - name: Setup Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decode keystore
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set"
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
          chmod 600 android/app/keystore.jks

      - name: Preflight keystore verification
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/app/keystore.jks
        run: |
          set -euo pipefail

          if [ ! -f "$KEYSTORE_FILE" ]; then
            echo "Keystore file not found: $KEYSTORE_FILE"
            exit 1
          fi

          if ! keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "Keystore preflight failed while checking the store password or alias."

            if ! keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
              echo "ERROR: wrong store password."
            else
              echo "ERROR: wrong alias."
            fi

            exit 1
          fi

          tmp_dir=$(mktemp -d)
          trap 'rm -rf "$tmp_dir"' EXIT
          tmp_keystore="$tmp_dir/verify.jks"

          if ! keytool -importkeystore \
            -srckeystore "$KEYSTORE_FILE" \
            -srcstorepass "$KEYSTORE_PASSWORD" \
            -srcalias "$KEY_ALIAS" \
            -srckeypass "$KEY_PASSWORD" \
            -destkeystore "$tmp_keystore" \
            -deststoretype JKS \
            -deststorepass "$KEYSTORE_PASSWORD" \
            -destkeypass "$KEY_PASSWORD" \
            -destalias "$KEY_ALIAS" \
            -noprompt >/dev/null 2>&1; then
            echo "ERROR: wrong key password."
            exit 1
          fi

          echo "Keystore preflight verification passed."

      - name: Decode Google Play Service Account key
        run: |
          echo "${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}" | base64 --decode > android/google-play-service-account.json

      - name: Build Flutter app bundle
        run: |
          echo "Building Flutter app bundle with optimized settings..."
          flutter build appbundle --release --verbose
          
      - name: Verify build output
        run: |
          echo "=== Verifying build output ==="
          find . -name "*.aab" -type f -exec ls -la {} \;
          echo "=== Build directory structure ==="
          find build/app/outputs -type f 2>/dev/null || echo "No build outputs found"

      - name: Deploy to Google Play Internal Testing (beta)
        if: env.BUILD_ENVIRONMENT == 'beta'
        working-directory: android
        run: bundle exec fastlane beta

      - name: Deploy to Google Play Production
        if: env.BUILD_ENVIRONMENT == 'release'
        working-directory: android
        run: bundle exec fastlane deploy

      - name: List build outputs
        run: |
          echo "=== Searching for all .aab and .apk files in project ==="
          find . -type f -name "*.aab" -o -name "*.apk" 2>/dev/null || echo "No AAB or APK files found"
          echo "=== Listing all build directories ==="
          find . -type d -name "build" 2>/dev/null
          echo "=== Listing android directory contents ==="
          ls -la android/
          echo "=== Checking specific build output paths ==="
          ls -la build/app/outputs/bundle/release/ 2>/dev/null || echo "Flutter build output directory not found"
          ls -la android/app/build/outputs/bundle/release/ 2>/dev/null || echo "Android build output directory not found"
          echo "=== File sizes and permissions ==="
          find . -name "*.aab" -exec ls -la {} \; 2>/dev/null || echo "No AAB files to check"

      - name: Upload Android build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-artifacts
          path: |
            build/app/outputs/bundle/release/*.aab
            android/app/build/outputs/bundle/release/*.aab
            **/*.aab
          retention-days: 30
