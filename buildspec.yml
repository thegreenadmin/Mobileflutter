version: 0.2

phases:
  install:
    runtime-versions:
      xcode: 15.0
    commands:
      - echo "Installing Flutter..."
      - if [ -d "/tmp/flutter" ]; then echo "Flutter already exists, skipping clone"; else git clone https://github.com/flutter/flutter.git -b stable --depth 1 /tmp/flutter; fi
      - export PATH="$PATH:/tmp/flutter/bin"
      - flutter --version
      - flutter doctor -v

  pre_build:
    commands:
      - echo "Installing dependencies..."
      - flutter pub get

  build:
    commands:
      - echo "Building Android APK..."
      - flutter build apk --release
      - echo "✅ Android build completed"
      
      - echo "Building iOS app..."
      - flutter build ios --simulator
      - echo "✅ iOS build completed"

  post_build:
    commands:
      - echo "Uploading artifacts to S3..."
      - BUILD_NUMBER=$CODEBUILD_BUILD_NUMBER
      - TIMESTAMP=$(date +%Y%m%d-%H%M%S)
      
      - aws s3 cp build/app/outputs/flutter-apk/app-release.apk s3://flutter-builds/android/app-${TIMESTAMP}-${BUILD_NUMBER}.apk
      - echo "✅ Uploaded Android APK to S3"
      
      - aws s3 cp build/ios/iphonesimulator/Runner.app s3://flutter-builds/ios/app-${TIMESTAMP}-${BUILD_NUMBER}.app --recursive
      - echo "✅ Uploaded iOS app to S3"

artifacts:
  files:
    - build/app/outputs/flutter-apk/app-release.apk
    - build/ios/iphonesimulator/Runner.app/**/*
  name: flutter-build-$(date +%Y%m%d-%H%M%S)
