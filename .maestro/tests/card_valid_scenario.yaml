appId: com.thegreenmall
---
# Positive test: Stripe test card 4242 4242 4242 4242 should tokenize and be added.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Stores?"
    timeout: 20000
- tapOn:
    point: "127,800"
- extendedWaitUntil:
    visible: "Manage"
    timeout: 10000
- tapOn: "Manage"
- extendedWaitUntil:
    visible: "Add Cards / Payment Methods"
    timeout: 10000
- tapOn: "Add Cards / Payment Methods"
- extendedWaitUntil:
    visible: "Add New Card"
    timeout: 10000
- tapOn: "Add New Card"
- extendedWaitUntil:
    visible: "Card Number"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    point: "201,393"
- inputText: "4242424242424242"
- tapOn:
    point: "100,473"
- inputText: "1230"
- tapOn:
    point: "301,473"
- inputText: "123"
- tapOn:
    point: "201,553"
- inputText: "Test User"
- hideKeyboard
- takeScreenshot: card_valid_filled
- swipe:
    start: "201,650"
    end: "201,250"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    text: "Add Card"
    index: 1
# Success: form clears and app navigates back to the card list.
- extendedWaitUntil:
    visible: "Add New Card"
    timeout: 20000
- extendedWaitUntil:
    visible: ".*4242"
    timeout: 10000
- takeScreenshot: card_valid_result
