appId: com.thegreenmall
---
# Reusable subflow: logs in with the test account (phone 0000000000 / OTP 0000)
# and lands on the authenticated home screen. Call via `runFlow: helpers/login.yaml`.
# clearState: each flow starts logged out, otherwise the session from the
# previous flow skips the login screen this helper waits for.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Login your account"
    timeout: 20000
- tapOn: "Login your account"
- extendedWaitUntil:
    visible: "Send Confirmation Code"
    timeout: 15000
- tapOn: "Mobile"
- inputText: "0000000000"
- tapOn: "Send Confirmation Code"
- extendedWaitUntil:
    visible: "Verification code"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- retry:
    maxRetries: 3
    commands:
      # The PIN field has no accessibility node on Android, so it can't be
      # targeted by text; tap the FIRST box (~64-66% down on the CI Pixel 6
      # emulator). The gaps between boxes don't take taps, so not the centre.
      - tapOn:
          point: "19%,65%"
      - inputText: "0000"
      - runFlow:
          when:
            visible: "Submit"
          commands:
            - tapOn: "Submit"
      - extendedWaitUntil:
          visible: "Stores?"
          timeout: 15000
