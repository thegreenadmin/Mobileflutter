appId: com.thegreenmall
---
# Payments -> Pay to a Business opens the barcode scanner; switch to manual
# phone entry. Stops before entering anything, so no money moves.
- runFlow: helpers/login.yaml
- tapOn: "Payments"
- extendedWaitUntil:
    visible: "Pay to a Business.*"
    timeout: 10000
- tapOn: "Pay to a Business.*"
# Camera permission prompt (first run after clearState). The CI emulator has
# no camera, so the scanner may show "Camera unavailable" instead of a feed.
- runFlow:
    when:
      visible: "While using the app"
    commands:
      - tapOn: "While using the app"
- extendedWaitUntil:
    visible: "Scan Barcode"
    timeout: 10000
- takeScreenshot: payment_scanner
- tapOn: "Enter Phone"
- extendedWaitUntil:
    visible: "Continue"
    timeout: 8000
- takeScreenshot: manual_entry_mode
