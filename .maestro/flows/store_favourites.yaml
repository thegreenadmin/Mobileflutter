appId: com.thegreenmall
---
# Verify the Favorites tab in store search and check favourite product screen.
- runFlow: helpers/login.yaml
- runFlow: helpers/goto_store_search.yaml

# Switch to Favorite tab
- tapOn: "Favorite"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: favorite_stores_tab

# If a favourite store exists, tap it and check Favorites screen
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          text: "Store Hours.*"
          index: 0
      - waitForAnimationToEnd:
          timeout: 5000
      - extendedWaitUntil:
          visible: "Welcome to.*"
          timeout: 10000

# Check the favourites section within the store
- retry:
    maxRetries: 2
    commands:
      - tapOn: "Favorites"
      - extendedWaitUntil:
          visible: "Favorites"
          timeout: 8000
      - takeScreenshot: favourite_products
