plugins {
    id "com.android.application"
    id "kotlin-android"
    id "com.google.gms.google-services"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Read from environment variables (for CI) or use defaults
def KEYSTORE_FILE = System.getenv("KEYSTORE_FILE") != null ? System.getenv("KEYSTORE_FILE") : (keystoreProperties['storeFile'] ?: "keystore.jks")
def KEYSTORE_PASSWORD = System.getenv("KEYSTORE_PASSWORD") != null ? System.getenv("KEYSTORE_PASSWORD") : (keystoreProperties['storePassword'] ?: "")
def KEY_ALIAS = System.getenv("KEY_ALIAS") != null ? System.getenv("KEY_ALIAS") : (keystoreProperties['keyAlias'] ?: "")
def KEY_PASSWORD = System.getenv("KEY_PASSWORD") != null ? System.getenv("KEY_PASSWORD") : (keystoreProperties['keyPassword'] ?: "")



android {
    namespace = "com.app.thegreenmall"
    compileSdkVersion 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        multiDexEnabled true
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.app.thegreenmall"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion 26
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }
    signingConfigs {
        release {
            if (file(KEYSTORE_FILE).exists()) {
                storeFile file(KEYSTORE_FILE)
                storePassword = KEYSTORE_PASSWORD
                keyAlias = KEY_ALIAS
                keyPassword = KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            if (file(KEYSTORE_FILE).exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig null
            }
        }
    }

}

flutter {
    source '../..'
}

dependencies {

    implementation 'com.google.firebase:firebase-dynamic-links:16.0.1'
    implementation "com.google.android.gms:play-services-wallet:19.2.0"
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'
    implementation "androidx.activity:activity:1.6.0-alpha05"
    implementation 'com.google.firebase:firebase-analytics-ktx'
    implementation platform('com.google.firebase:firebase-bom:31.3.0')
    implementation "androidx.appcompat:appcompat:1.6.1" // For loading and tinting drawables on older versions of the platform 
    //implementation "androidx.appcompat:appcompat-resources:1.6.1"
    //implementation "com.android.support:appcompat-v7:28.0.0"
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // implementation fileTree(dir: 'libs', include: ['*.jar'])
    //implementation 'com.android.support:appcompat-v7:22.2.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.0.20"
    implementation "com.android.billingclient:billing:5.2.0"
}
